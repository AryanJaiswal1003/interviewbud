[project]
name = "interviewbud"
version = "0.1.0"
description = "AI technical screening interviewer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "openai>=3.34",
  "fish-audio-sdk>=1.3.0",
  "ag-ui-protocol>=1.0.0",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.32",
  "pydantic>=2.14",
  "pydantic-settings>=2.6",
  "pypdf>=6.21",
  "python-docx>=1.2",
  "python-multipart>=0.0.32",
  "ormsgpack>=1.13",
  "websockets>=17",
  "httpx>=0.28",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "trafilatura>=2.0",
  "playwright==1.63.0",
]

[project.optional-dependencies]
local-stt = [
    "faster-whisper>=1.2",
    "mlx-whisper>=0.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
